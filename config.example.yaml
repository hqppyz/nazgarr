# Nazgarr - static configuration
#
# Physical disks are NOT listed here: just mount them into the container
# (Docker volumes or the Unraid template) and they show up in
# Settings > Storage, ready to add as disks (see docs/SPEC.md SS4).
#
# disk_scan_root: optional. In Docker you don't need it: the folders you
# mount are where disks can be (a single /data, TRaSH Guides style, or
# /mnt/disk1 and /mnt/disk2 for separate disks). Set it only to restrict
# disks to one folder; outside Docker (pipx) `nazgarr init` writes it.
#
# disk_scan_root: /data
#
# data_dir: the app's own persistent state (SQLite database, poster
# cache) - lives under the config mount by default so a single appdata
# volume covers both config.yaml and this.

data_dir: /app/config/data
