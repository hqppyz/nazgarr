# Profilo bundlato per ItaTorrents (ITT), tracker UNIT3D (docs/SPEC.md §9).
#
# category_id/resolution_id: default standard UNIT3D, ITT non li sovrascrive.
# type_id: mapping specifico ITT.
# Entrambi verificati contro il codice tracker reale e funzionante di
# Upload-Assistant (src/trackers/ITT.py, src/trackers/UNIT3D.py — riferimento
# di dominio, nessun codice riusato, solo le tabelle id/nome), non
# inventati — ma vanno comunque riverificati dall'utente contro il proprio
# account ITT prima del primo upload reale: un tracker può cambiare questi
# id nel tempo, e questo file non viene mai riletto dopo che il profilo è
# stato copiato nel DB (tracker_upload_profile), quindi un aggiornamento
# futuro dell'app non tocca un'istanza già configurata.
key: itt
label: "ITT (ItaTorrents)"
adapter_type: unit3d
# Host dell'API UNIT3D, non l'announce URL (personale, mai bundlato) —
# verificato contro il codice reale di Upload-Assistant (src/trackers/ITT.py).
base_url: "https://itatorrents.xyz"
upload:
  # La lingua del tracker (ISO 639-1): alla creazione del profilo va sul
  # tracker (tracker.language, modificabile nelle sue impostazioni) e da lì
  # decide titolo localizzato, lingua messa per prima e SUB/SUBS ITA.
  language: it
  category_id:
    movie: 1
    tv: 2
  type_id:
    DISC: 1
    REMUX: 2
    ENCODE: 3
    WEBDL: 4
    WEBRIP: 5
    HDTV: 6
    DVDRIP: 24
    BRRIP: 25
    WEBMUX: 26
    DLMUX: 27
    BDMUX: 29
    DVDMUX: 39
  resolution_id:
    "8640p": 10
    "4320p": 1
    "2160p": 2
    "1440p": 3
    "1080p": 3
    "1080i": 4
    "720p": 5
    "576p": 6
    "576i": 7
    "480p": 8
    "480i": 9
  # Regole di naming (nazgarr/upload_naming.py). Versionate: alzare "version"
  # quando il tracker cambia le sue regole. All'avvio un profilo non
  # modificato dall'utente si aggiorna da solo; uno modificato riceve
  # l'offerta di aggiornarsi, a meno di "force: true" (nazgarr/upload_profiles.py).
  # Ricostruite dalle regole di ItaTorrents come le implementa
  # Upload-Assistant (src/trackers/ITT.py, riferimento di dominio): da
  # verificare contro il regolamento del tracker prima del primo upload.
  naming:
    version: 11
    force: false
    title: local
    audio_languages:
      style: primary_first
      multi_from: 10
    subs_languages:
      style: primary_first
      multi_from: 3
    group_separator: "-"
    # Senza HDR nel MediaInfo (o nel nome), SDR al posto di {hdr}
    # (decisione dell'utente, 2026-10-03).
    sdr_label: SDR
    # SUB o SUBS, più ITA solo se l'audio non è in italiano e c'è un
    # sottotitolo italiano (decisione dell'utente, 2026-09-30).
    subs_style: tracker_language
    # Pattern indicati dall'utente (2026-09-30). {source_full} è il campo
    # "Source" della wiki di ITT: il servizio per WEB-DL/WEBRip/WEBMux/DLMux,
    # la sorgente (BluRay, UHD BluRay, HDTV, ...) per remux, encode e HDTV.
    templates:
      default: "{title} {year} {edition} {repack} {resolution} {format} {source_full} {hybrid} {type} {audio_all} {audio_languages} {subs} {hdr} {video_codec} {group}"
      tv: "{title} {season} {repack} {resolution} {format} {source_full} {hybrid} {type} {audio_all} {audio_languages} {subs} {hdr} {video_codec} {group}"
    type_labels:
      REMUX: "VU REMUX"
    # Un ibrido (DV profilo 8 aggiunto a un remux) non è video untouched:
    # "HYBRID REMUX", senza VU (decisione dell'utente, 2026-10-02).
    hybrid_type_labels:
      REMUX: "REMUX"
      WEBDL: "WEB-DL"
      WEBRIP: "WEBRip"
      WEBMUX: "WEBMux"
      DLMUX: "DLMux"
      ENCODE: ""
      HDTV: ""
      DVDRIP: "DVDRip"
      BRRIP: "BRRip"
    # {format}: ITT ha solo SD, FullHD e UHD, il 720p è SD.
    format_labels:
      HD: SD
  # Senza il MediaInfo: UNIT3D lo riceve nel suo campo (mediainfo) e lo
  # mostra da sé.
  # Gli screenshot due per riga (700px), centrati, ognuno col link all'immagine
  # intera (decisione dell'utente, 2026-09-30).
  description_template: |
    {% if screenshot_urls %}[center]{% for url in screenshot_urls %}[url={{ url }}][img=700]{{ url }}[/img][/url]{% if loop.last %}{% elif loop.index is divisibleby 2 %}
    {% else %} {% endif %}{% endfor %}[/center]{% endif %}
    {% if notes %}
    {{ notes }}
    {% endif %}
  # Le descrizioni bundlate di prima: un profilo che ha ancora una di queste
  # (mai toccata dall'utente) passa all'attuale all'avvio.
  replaces_description_templates:
    - |
      {% if screenshot_urls %}[center]{% for url in screenshot_urls %}[url={{ url }}][img=400]{{ url }}[/img][/url]{% if loop.last %}{% elif loop.index is divisibleby 2 %}
      {% else %} {% endif %}{% endfor %}[/center]{% endif %}
      {% if notes %}
      {{ notes }}
      {% endif %}
    - |
      {% for url in screenshot_urls %}[img]{{ url }}[/img]
      {% endfor %}
      {% if notes %}
      {{ notes }}
      {% endif %}
    - |
      [mediainfo]{{ mediainfo }}[/mediainfo]

      {% for url in screenshot_urls %}[img]{{ url }}[/img]
      {% endfor %}
      {% if notes %}
      {{ notes }}
      {% endif %}
  # Percentuali di freeleech che il tracker lascia scegliere a chi carica
  # (campo UNIT3D "free"). Vuoto finché non è verificato sul regolamento.
  freeleech:
    options: []
    default: 0
  default_flags:
    anonymous: false
    personal_release: false
