# Aggiornamenti delle dipendenze come pull request da rivedere: le action
# sono fissate al commit, le librerie Python al lock con hash
# (requirements.txt, da rigenerare con uv dalla PR), le immagini base del
# Dockerfile ai loro digest (tag@sha256:…): Dependabot propone il digest nuovo.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
