name: Build and publish Docker image

# A ogni push su main: versione = patch successiva all'ultimo tag vX.Y.Z
# (o BASE_VERSION di app/version.py se più alta, per i salti di minor),
# immagine pubblicata come :nightly, :X.Y.Z e :sha-xxxxxxx, poi tag git e
# GitHub Release con le note generate dai commit, come PRERELEASE: sono
# build di test (canale :nightly). :stable e :latest (sempre uguali) si
# aggiornano solo a mano, con .github/workflows/promote-stable.yml. Nessun commit automatico
# sul repo. Un tag vX.Y.Z spinto a mano pubblica esattamente quella
# versione. I tag creati qui col GITHUB_TOKEN non fanno ripartire il
# workflow (comportamento di GitHub Actions), quindi niente doppie build.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

# Due push ravvicinati non devono calcolare la stessa versione.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Rename del progetto (Gauntletarr -> Nazgarr): le stesse immagini anche sul
  # nome vecchio, così chi non ha ancora cambiato repository continua a
  # ricevere gli aggiornamenti. Da togliere dopo la prossima stable.
  LEGACY_IMAGE: ghcr.io/lktorrentz/gauntletarr

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag + release
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # servono i tag per calcolare la versione

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            release=false
          else
            base=$(sed -n 's/^BASE_VERSION = "\([0-9]*\.[0-9]*\.[0-9]*\)"/\1/p' app/version.py)
            latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^v//')
            if [[ -z "$latest" ]]; then
              IFS=. read -r major minor patch <<< "$base"
              version="$major.$minor.$((patch + 1))"
            elif [[ "$(printf '%s\n%s\n' "$base" "$latest" | sort -V | tail -n1)" == "$base" && "$base" != "$latest" ]]; then
              version="$base"
            else
              IFS=. read -r major minor patch <<< "$latest"
              version="$major.$minor.$((patch + 1))"
            fi
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Version: $version (commit ${GITHUB_SHA::7})"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Ordine voluto: GHCR mostra per primo l'ultimo tag applicato, e i tag
          # vengono applicati in quest'ordine. Così nell'elenco: nightly, poi la
          # versione, poi lo sha (stable/latest li aggiunge dopo la promozione,
          # e finiscono in cima).
          tags: |
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=nightly,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NAZGARR_VERSION=${{ steps.version.outputs.version }}
            NAZGARR_COMMIT=${{ steps.version.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Niente manifest di attestazione (piattaforma "unknown/unknown")
          # nell'indice: con quelli il controllo/force update di Unraid non
          # riconosce l'immagine nuova. Resta una lista di manifest Docker
          # con le sole piattaforme vere (amd64, arm64).
          provenance: false
          sbom: false

      - name: Mirror to the legacy image name
        # Copia server-side degli stessi manifest, nessuna nuova build. Mai
        # bloccante: se il vecchio pacchetto non è più scrivibile, il rilascio
        # sul nome nuovo è già fatto.
        continue-on-error: true
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME,,}"
          args=()
          for tag in $TAGS; do args+=(-t "$LEGACY_IMAGE:${tag##*:}"); done
          docker buildx imagetools create "${args[@]}" "$image:$VERSION"

      # Solo dopo un'immagine pubblicata: un tag esiste sempre anche su GHCR.
      - name: Tag and release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          previous=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"
          args=(--title "v$VERSION" --generate-notes --prerelease)
          if [[ -n "$previous" ]]; then
            args+=(--notes-start-tag "$previous")
          fi
          gh release create "v$VERSION" "${args[@]}"
