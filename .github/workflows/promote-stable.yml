name: Promote to stable

# Canale stable, per chi prova l'app senza ricevere ogni build di test:
# una versione già pubblicata da docker-publish.yml (immagine :X.Y.Z e
# GitHub Release vX.Y.Z, prerelease) diventa quella stable.
# - immagini :stable e :latest = stessa lista di manifest di :X.Y.Z (nessuna
#   nuova build): chi usa :latest resta sul canale stable, le build di test
#   sono su :nightly;
# - GitHub Release vX.Y.Z non più prerelease, segnata come Latest (è ciò
#   che il controllo aggiornamenti dell'app confronta sul canale stable);
# - tag git "stable" spostato sul commit di vX.Y.Z;
# - il pacchetto Python (installazione senza Docker, pipx) costruito dal
#   commit di vX.Y.Z, allegato alla release e pubblicato su TestPyPI e poi
#   su PyPI: solo per le stable (decisione dell'utente, 2026-10-02), mai per
#   le build di test.
# Il tag "stable" non corrisponde a v*.*.*: non fa ripartire docker-publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (e.g. 0.3.0). Empty = the latest published version."
        required: false
        default: ""

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      # Ogni controllo prima di toccare il registry (audit 2026-10-18): prima
      # bastava che il tag esistesse, e un tag di prova (0.9.1-dev) o uno
      # spinto a mano senza release spostava :stable e :latest su quella build
      # e poi falliva a metà, con il tag git stable e la release ancora sulla
      # versione precedente.
      - name: Resolve version
        id: version
        env:
          INPUT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT#v}"
          if [[ -z "$version" ]]; then
            version=$(git tag -l 'v[0-9]*' --sort=-v:refname | { grep -Ex -m1 'v[0-9]+\.[0-9]+\.[0-9]+' || true; } | sed 's/^v//')
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only a plain X.Y.Z version can be promoted, not '$version'" >&2
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version not found: publish it first (push to main)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse "v$version^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Check that the version can become stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Solo build di main: un tag vX.Y.Z da un altro branch ha l'immagine
          # ma non è mai passato da main.
          if ! git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH"; then
            echo "v$VERSION ($COMMIT) is not on $DEFAULT_BRANCH: only builds of $DEFAULT_BRANCH can become stable" >&2
            exit 1
          fi
          # La release la crea docker-publish.yml solo per le build di main.
          if ! gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null; then
            echo "No GitHub Release for v$VERSION: only versions published by docker-publish.yml can be promoted" >&2
            exit 1
          fi
          echo "Promoting v$VERSION ($COMMIT) to stable"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Tag the image as stable and latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME,,}"
          source="$image:$VERSION"
          docker buildx imagetools create -t "$image:latest" -t "$image:stable" "$source"
          docker buildx imagetools inspect "$image:stable"

      - name: Mark the release as stable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release edit "v$VERSION" --prerelease=false --latest
          # Le note dettagliate: la sezione "## X.Y.Z" di CHANGELOG.md, se c'è
          # (proposte prima della promozione e approvate, nazgarr/core/updates.py).
          awk -v v="$VERSION" '/^## /{found = ($2 == v)} found' CHANGELOG.md > release-notes.md
          if [[ -s release-notes.md ]]; then
            gh release edit "v$VERSION" --notes-file release-notes.md
          else
            echo "::warning::CHANGELOG.md has no section for $VERSION: release notes left as they were"
          fi
          git tag -f stable "v$VERSION^{commit}"
          git push -f origin stable

  # Il pacchetto si costruisce senza permessi di scrittura né token: npm ci,
  # pip e la build eseguono codice di terzi, e prima lo facevano con il
  # GITHUB_TOKEN in scrittura nell'ambiente e salvato da checkout in
  # .git/config (audit 2026-10-18). L'unico passo che scrive, allegare il
  # pacchetto alla release, è attach-package, che non esegue codice del repo.
  build-package:
    needs: promote
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: v${{ needs.promote.outputs.version }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Una versione di prima del pacchetto (senza lo script) non ne ha uno.
      - name: Build the package
        id: build
        env:
          VERSION: ${{ needs.promote.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! -x scripts/build_package.sh ]]; then
            echo "::notice::v$VERSION predates the Python package: nothing to attach or publish"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/build_package.sh "$VERSION" "$(git rev-parse --short HEAD)"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Keep the package for the next jobs
        if: steps.build.outputs.built == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  # Solo scaricare l'artifact e caricarlo: nessun checkout, nessun codice
  # del repo o di terzi accanto al token in scrittura.
  attach-package:
    needs: [promote, build-package]
    if: needs.build-package.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # asset della release
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.promote.outputs.version }}
        run: gh release upload "v$VERSION" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Pubblicazione con Trusted Publishing (OIDC): nessun token salvato, PyPI
  # riconosce questo workflow e il suo environment. Prima TestPyPI, la prova
  # generale; poi PyPI, solo se la prova è andata. Una versione pubblicata
  # non si può ricaricare (solo ritirare): per questo solo le stable.
  publish-testpypi:
    needs: [build-package, attach-package]
    if: needs.build-package.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nazgarr
    permissions:
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # una promozione rilanciata non fallisce qui

  publish-pypi:
    needs: [build-package, publish-testpypi]
    if: needs.build-package.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nazgarr
    permissions:
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          skip-existing: true
