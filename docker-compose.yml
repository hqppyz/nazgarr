# One container, one process: the web app, with the scheduler and the
# upload worker inside it, run by supervisord (see Dockerfile and
# docker/supervisord.conf) - a single docker-compose service.
#
# ./config is mounted as a DIRECTORY (not a file): if config/config.yaml
# doesn't exist on first start, the container creates it from
# config.example.yaml and starts anyway with default values. The app's
# own persistent state (SQLite database, poster cache) lives under this
# same mount by default (config.example.yaml's data_dir) - no separate
# volume needed for it.
#
# ./data below follows the TrashGuide convention: a single folder shared
# with your download client and media manager (torrents/ and media/ both
# under it), so hardlinks between them work. Point it at wherever your
# actual library + torrents live on the host. Nazgarr finds the folders
# you mount on its own: Settings > Storage proposes each one as a disk.
#
# Multiple separate physical disks instead of one combined mount? Don't
# pass /data at all - mount each disk on its own (/mnt below is just the
# classic Unraid convention). Each one then shows up on its own in
# Settings > Storage, ready to add. Example for three disks:
#
#   volumes:
#     - ./config:/app/config
#     - /mnt/disk1:/mnt/disk1
#     - /mnt/disk2:/mnt/disk2
#     - /mnt/disk3:/mnt/disk3
#
# Never mount the user share (/mnt/user/...) next to the single disks: the
# same files would be seen twice. And mount media and torrents through one
# common folder, never as two separate mounts: hardlinks cannot cross mounts.
# A fourth disk later is just one more line here, no restart of the app
# logic needed beyond restarting the container to pick up the new mount.

services:
  nazgarr:
    build: .
    container_name: nazgarr
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Rome
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/data
      # - /mnt/disk1:/mnt/disk1   # multi-disk layout: uncomment these,
      # - /mnt/disk2:/mnt/disk2   # remove the ./data line above, and set
      # - /mnt/disk3:/mnt/disk3
