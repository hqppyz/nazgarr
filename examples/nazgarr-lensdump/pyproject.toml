[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nazgarr-lensdump"
version = "0.1.0"
description = "Lensdump image host for Nazgarr (example plugin; Lensdump's API is a paid feature)"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = []

[project.entry-points."nazgarr.plugins"]
lensdump = "nazgarr_lensdump:setup"
