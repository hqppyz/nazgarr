# Profilo bundlato per ItaTorrents (ITT), tracker UNIT3D (docs/SPEC.md §9).
#
# category_id/resolution_id: default standard UNIT3D, ITT non li sovrascrive.
# type_id: mapping specifico ITT.
# Entrambi verificati contro il codice tracker reale e funzionante di
# Upload-Assistant (src/trackers/ITT.py, src/trackers/UNIT3D.py — riferimento
# di dominio, nessun codice riusato, solo le tabelle id/nome), non
# inventati — ma vanno comunque riverificati dall'utente contro il proprio
# account ITT prima del primo upload reale: un tracker può cambiare questi
# id nel tempo, e questo file non viene mai riletto dopo che il profilo è
# stato copiato nel DB (tracker_upload_profile), quindi un aggiornamento
# futuro dell'app non tocca un'istanza già configurata.
key: itt
label: "ITT (ItaTorrents)"
adapter_type: unit3d
# Host dell'API UNIT3D, non l'announce URL (personale, mai bundlato) —
# verificato contro il codice reale di Upload-Assistant (src/trackers/ITT.py).
base_url: "https://itatorrents.xyz"
upload:
  category_id:
    movie: 1
    tv: 2
  type_id:
    DISC: 1
    REMUX: 2
    ENCODE: 3
    WEBDL: 4
    WEBRIP: 5
    HDTV: 6
    DVDRIP: 24
    BRRIP: 25
    WEBMUX: 26
    DLMUX: 27
    BDMUX: 29
    DVDMUX: 39
  resolution_id:
    "8640p": 10
    "4320p": 1
    "2160p": 2
    "1440p": 3
    "1080p": 3
    "1080i": 4
    "720p": 5
    "576p": 6
    "576i": 7
    "480p": 8
    "480i": 9
  # Regole di naming (app/upload_naming.py). Versionate: alzare "version"
  # quando il tracker cambia le sue regole. All'avvio un profilo non
  # modificato dall'utente si aggiorna da solo; uno modificato riceve
  # l'offerta di aggiornarsi, a meno di "force: true" (app/upload_profiles.py).
  # Ricostruite dalle regole di ItaTorrents come le implementa
  # Upload-Assistant (src/trackers/ITT.py, riferimento di dominio): da
  # verificare contro il regolamento del tracker prima del primo upload.
  naming:
    version: 4
    force: false
    title: local
    title_language: it
    audio_languages:
      style: primary_first
      primary: ITA
      multi_from: 3
    group_separator: "-"
    # Un pattern, più quello per le serie (senza anno): cambia solo come si
    # scrive il tipo.
    templates:
      default: "{title} {year} {edition} {repack} {resolution} {service} {type} {hdr} {video_codec} {audio_languages} {audio_all} {group}"
      tv: "{title} {season} {edition} {repack} {resolution} {service} {type} {hdr} {video_codec} {audio_languages} {audio_all} {group}"
    type_labels:
      REMUX: "{source} REMUX VU"
      WEBDL: "WEB-DL"
      WEBRIP: "WEBRip"
      ENCODE: ""
      HDTV: ""
      DVDRIP: "DVDRip"
      BRRIP: "BRRip"
  description_template: |
    [mediainfo]{{ mediainfo }}[/mediainfo]

    {% for url in screenshot_urls %}[img]{{ url }}[/img]
    {% endfor %}
    {% if notes %}
    {{ notes }}
    {% endif %}
  # Percentuali di freeleech che il tracker lascia scegliere a chi carica
  # (campo UNIT3D "free"). Vuoto finché non è verificato sul regolamento.
  freeleech:
    options: []
    default: 0
  default_flags:
    anonymous: false
    personal_release: false
